[project]
name = "soundlink-warehouse-connector"
version = "0.1.0"
description = "ELT connector: Soundlink Public API → local/cloud warehouse (DuckDB/BigQuery)"
readme = "README.md"
authors = [
    { name = "jotanarciso", email = "joaoznarciso@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "duckdb>=1.5.5",
    "httpx>=0.28.1",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.15.0",
    "tenacity>=9.1.4",
    "typer>=0.27.1",
]

[project.optional-dependencies]
bigquery = [
    "google-cloud-bigquery>=3.44.0",
]

[project.scripts]
soundlink-sync = "soundlink_warehouse_connector.cli:app"

[build-system]
requires = ["uv_build>=0.12.6,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "google-cloud-bigquery>=3.44.0",
    "pytest>=9.1.1",
    "respx>=0.23.1",
    "ruff>=0.16.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
